name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: DESIGN.md / tokens.css drift guard
        run: npm run check:tokens

      - name: shadcn registry.json validation
        run: npm run check:registry

      # Public build: no API key / internal gateway env vars. The demo asks each visitor for
      # their own OpenAI-compatible endpoint + key (stored only in their browser).
      - name: Build (project page sub-path, no secrets)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if env | grep -E '^VITE_[A-Z0-9_]*(KEY|SECRET|TOKEN|BASE_URL|PROXY_TARGET)=' >/dev/null; then
            echo "Refusing to build: VITE_* key/endpoint env vars are set" >&2
            exit 1
          fi
          npm run build

      - name: Guard dist against secrets / internal host
        run: npm run check:dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
